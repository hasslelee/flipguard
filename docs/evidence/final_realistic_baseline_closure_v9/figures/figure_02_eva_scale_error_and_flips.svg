<svg xmlns="http://www.w3.org/2000/svg" width="960" height="418" viewBox="0 0 960 418" role="img" aria-labelledby="title desc">
<title id="title">EVA scale, error, and decision outcome</title><desc id="desc">Native-runtime numerical and decision evidence remain separate from common-executor latency.</desc>
<rect width="960" height="418" fill="#ffffff"/><text x="48" y="48" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0d2a52">EVA scale, error, and decision outcome</text><text x="48" y="78" font-family="Arial,sans-serif" font-size="15" fill="#57606a">Native-runtime numerical and decision evidence remain separate from common-executor latency.</text>
<g font-family="Arial,sans-serif"><rect x="48" y="118" width="864" height="62" rx="6" fill="#f6f8fa" stroke="#cf222e" stroke-width="2"/><text x="72" y="145" font-size="17" font-weight="700" fill="#0d1117">Scale 20</text><text x="72" y="167" font-size="14" fill="#57606a">Rejected: numerical error and decision flips</text><rect x="48" y="204" width="864" height="62" rx="6" fill="#f6f8fa" stroke="#2da44e" stroke-width="2"/><text x="72" y="231" font-size="17" font-weight="700" fill="#0d1117">Scale 30</text><text x="72" y="253" font-size="14" fill="#57606a">Finite validation and locked audit SAFE</text><rect x="48" y="290" width="864" height="62" rx="6" fill="#f6f8fa" stroke="#2da44e" stroke-width="2"/><text x="72" y="317" font-size="17" font-weight="700" fill="#0d1117">Scale 40</text><text x="72" y="339" font-size="14" fill="#57606a">Finite validation and locked audit SAFE</text></g></svg>
