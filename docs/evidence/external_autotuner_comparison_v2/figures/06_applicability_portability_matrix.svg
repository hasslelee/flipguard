<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img"><title>Applicability and portability</title><desc>A buildable artifact is not automatically a fair baseline</desc><rect width="1200" height="680" fill="#ffffff"/><text x="60" y="76" font-family="sans-serif" font-size="34" font-weight="700" fill="#0D2A52">Applicability and portability</text><text x="60" y="112" font-family="sans-serif" font-size="18" fill="#425466">A buildable artifact is not automatically a fair baseline</text><rect x="60" y="160" width="1080" height="46" rx="6" fill="#eef5ff" stroke="#1f6feb"/><text x="82" y="190" font-family="sans-serif" font-size="18" fill="#0d2a52">EXACT_NATIVE</text><rect x="60" y="222" width="1080" height="46" rx="6" fill="#eef5ff" stroke="#1f6feb"/><text x="82" y="252" font-family="sans-serif" font-size="18" fill="#0d2a52">SEMANTICALLY_MAPPABLE</text><rect x="60" y="284" width="1080" height="46" rx="6" fill="#eef5ff" stroke="#1f6feb"/><text x="82" y="314" font-family="sans-serif" font-size="18" fill="#0d2a52">PLAN_UNSUPPORTED</text><rect x="60" y="346" width="1080" height="46" rx="6" fill="#eef5ff" stroke="#1f6feb"/><text x="82" y="376" font-family="sans-serif" font-size="18" fill="#0d2a52">NOT_APPLICABLE_NO_BOOTSTRAP</text><rect x="60" y="408" width="1080" height="46" rx="6" fill="#eef5ff" stroke="#1f6feb"/><text x="82" y="438" font-family="sans-serif" font-size="18" fill="#0d2a52">ARTIFACT_UNAVAILABLE or BUILD_BLOCKED</text></svg>
