<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img"><title>Tuning cost accounting</title><desc>Plans generated and executed are reported separately</desc><rect width="1200" height="680" fill="#ffffff"/><text x="60" y="76" font-family="sans-serif" font-size="34" font-weight="700" fill="#0D2A52">Tuning cost accounting</text><text x="60" y="112" font-family="sans-serif" font-size="18" fill="#425466">Plans generated and executed are reported separately</text><rect x="60" y="160" width="1080" height="46" rx="6" fill="#eef5ff" stroke="#1f6feb"/><text x="82" y="190" font-family="sans-serif" font-size="18" fill="#0d2a52">Compiler pass</text><rect x="60" y="222" width="1080" height="46" rx="6" fill="#eef5ff" stroke="#1f6feb"/><text x="82" y="252" font-family="sans-serif" font-size="18" fill="#0d2a52">Search candidates</text><rect x="60" y="284" width="1080" height="46" rx="6" fill="#eef5ff" stroke="#1f6feb"/><text x="82" y="314" font-family="sans-serif" font-size="18" fill="#0d2a52">Encrypted executions</text><rect x="60" y="346" width="1080" height="46" rx="6" fill="#eef5ff" stroke="#1f6feb"/><text x="82" y="376" font-family="sans-serif" font-size="18" fill="#0d2a52">Key runs</text><rect x="60" y="408" width="1080" height="46" rx="6" fill="#eef5ff" stroke="#1f6feb"/><text x="82" y="438" font-family="sans-serif" font-size="18" fill="#0d2a52">Wall-clock boundary</text></svg>
