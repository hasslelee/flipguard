<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img"><title>Stable-candidate latency</title><desc>Only SAFE-to-SAFE PORTABLE_EXACT arms enter a headline</desc><rect width="1200" height="680" fill="#ffffff"/><text x="60" y="76" font-family="sans-serif" font-size="34" font-weight="700" fill="#0D2A52">Stable-candidate latency</text><text x="60" y="112" font-family="sans-serif" font-size="18" fill="#425466">Only SAFE-to-SAFE PORTABLE_EXACT arms enter a headline</text><rect x="60" y="160" width="1080" height="46" rx="6" fill="#eef5ff" stroke="#1f6feb"/><text x="82" y="190" font-family="sans-serif" font-size="18" fill="#0d2a52">No external arm met every exact-portability condition</text><rect x="60" y="222" width="1080" height="46" rx="6" fill="#eef5ff" stroke="#1f6feb"/><text x="82" y="252" font-family="sans-serif" font-size="18" fill="#0d2a52">Existing FlipGuard bounded-catalog comparison remains separate</text><rect x="60" y="284" width="1080" height="46" rx="6" fill="#eef5ff" stroke="#1f6feb"/><text x="82" y="314" font-family="sans-serif" font-size="18" fill="#0d2a52">No raw cross-runtime superiority claim</text></svg>
