name: CI

on:
  pull_request:
  push:
    branches:
      - docs/github-publication-v1

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go test and vet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Set up Go from go.mod
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  public-docs:
    name: Public documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install pinned documentation dependencies
        run: python3 -m pip install --requirement requirements-ci.txt
      - name: Run focused public tests
        run: python3 -m unittest scripts.tests.test_lint_public_readme
      - name: Lint public README and assets
        run: python3 scripts/lint_public_readme.py
      - name: Compile public Python tools
        run: python3 -m py_compile scripts/build_public_brand_assets.py scripts/build_github_publication_preview.py scripts/lint_public_readme.py
      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r script; do bash -n "$script"; done < <(find scripts -maxdepth 1 -type f -name '*.sh' -print | sort)
      - name: Verify generated public preview
        run: python3 scripts/build_github_publication_preview.py --verify

  sensitive-files:
    name: Public hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Reject new key and credential files
        shell: bash
        run: |
          set -euo pipefail
          ! git ls-files | grep -E '(^|/)(id_rsa|id_ed25519|credentials|\.env)$|\.(pem|key|p12)$'
      - name: Reject local paths in public surfaces
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n -E '/home/[^/]+/|file://|[A-Za-z]:\\\\Users\\\\' README.md README_ko.md CONTRIBUTING.md SECURITY.md docs/ARCHITECTURE.md docs/DECISION_CONTRACTS.md docs/RESULTS.md docs/REPRODUCIBILITY.md docs/CLAIM_SCOPE.md docs/REPOSITORY_GUIDE.md
