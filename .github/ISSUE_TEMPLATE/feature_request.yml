name: Feature request
description: Propose a scoped software, adapter, verification, or documentation improvement.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or research problem is not handled today?
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Proposed scope
      options:
        - Supported graph adapter
        - Candidate provider integration
        - Decision contract
        - Security or provenance verification
        - Performance tooling
        - Documentation or artifact usability
        - Other
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include inputs, outputs, failure semantics, and how the change remains fail closed.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and falsification
      description: What tests or predeclared evidence would show the proposal is wrong?
  - type: checkboxes
    id: boundaries
    attributes:
      label: Research boundaries
      options:
        - label: I understand that frozen policies and evidence cannot be retuned or overwritten.
          required: true
        - label: I will not describe bounded evidence as global optimality, universal security, or distribution-wide safety.
          required: true
