<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlipGuard brand gallery</title><style>:root{color-scheme:light dark;--bg:#fff;--fg:#24292f;--muted:#57606a;--border:#d0d7de;--code:#f6f8fa;--link:#0969da}
@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#f0f6fc;--muted:#b6c2cf;--border:#30363d;--code:#161b22;--link:#58a6ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:980px;margin:0 auto;padding:40px 28px 80px}a{color:var(--link)}img{max-width:100%;height:auto}h1,h2{border-bottom:1px solid var(--border);padding-bottom:.35em}h2{margin-top:2em}code{background:var(--code);padding:.15em .35em;border-radius:4px}pre{overflow:auto;background:var(--code);padding:16px;border-radius:6px}pre code{padding:0}table{display:block;overflow-x:auto;border-collapse:collapse;width:max-content;max-width:100%}th,td{border:1px solid var(--border);padding:8px 12px}blockquote{margin-left:0;padding-left:16px;border-left:4px solid var(--border);color:var(--muted)}
@media(max-width:640px){main{padding:24px 16px 56px;font-size:15px}h1{font-size:1.75rem}h2{font-size:1.35rem}table{font-size:13px}}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.tile{margin:0;padding:20px;border:1px solid var(--border);background:#fff;color:#24292f;min-height:180px;display:flex;flex-direction:column;justify-content:center}.tile.dark{background:#0d1117;color:#f0f6fc}figcaption{margin-top:14px;font:13px ui-monospace,monospace}</style></head>
<body><main><h1>FlipGuard brand gallery</h1><div class="grid"><figure class="tile"><img src="../../docs/assets/brand/flipguard-mark.svg" alt="flipguard-mark.svg"><figcaption>flipguard-mark.svg</figcaption></figure><figure class="tile dark"><img src="../../docs/assets/brand/flipguard-mark-dark.svg" alt="flipguard-mark-dark.svg"><figcaption>flipguard-mark-dark.svg</figcaption></figure><figure class="tile"><img src="../../docs/assets/brand/flipguard-mark-mono.svg" alt="flipguard-mark-mono.svg"><figcaption>flipguard-mark-mono.svg</figcaption></figure><figure class="tile"><img src="../../docs/assets/brand/flipguard-wordmark.svg" alt="flipguard-wordmark.svg"><figcaption>flipguard-wordmark.svg</figcaption></figure><figure class="tile dark"><img src="../../docs/assets/brand/flipguard-wordmark-dark.svg" alt="flipguard-wordmark-dark.svg"><figcaption>flipguard-wordmark-dark.svg</figcaption></figure><figure class="tile dark"><img src="../../docs/assets/brand/flipguard-social-preview.png" alt="flipguard-social-preview.png"><figcaption>flipguard-social-preview.png</figcaption></figure><figure class="tile"><img src="../../docs/assets/brand/flipguard-mark-128.png" alt="flipguard-mark-128.png"><figcaption>flipguard-mark-128.png</figcaption></figure><figure class="tile"><img src="../../docs/assets/brand/flipguard-mark-512.png" alt="flipguard-mark-512.png"><figcaption>flipguard-mark-512.png</figcaption></figure></div></main></body></html>
