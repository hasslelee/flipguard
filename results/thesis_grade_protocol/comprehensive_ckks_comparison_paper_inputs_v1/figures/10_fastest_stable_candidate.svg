<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc"><title id="title">Fastest stable candidate by exact shared scope</title><desc id="desc">Internal shared arms and unavailable external common-executor arms are separated.</desc><rect width="1100" height="520" fill="#fff"/><text x="70" y="55" font-family="sans-serif" font-size="29" font-weight="700" fill="#0D2A52">Fastest stable candidate by exact shared scope</text><text x="70" y="88" font-family="sans-serif" font-size="15" fill="#475569">Counts denote declared comparison units, not the global CKKS space.</text><g font-family="sans-serif"><text x="70" y="153" font-size="17" fill="#0D2A52">Direct fastest (controlled primary)</text><rect x="70" y="165" width="760.0" height="42" rx="3" fill="#2DA44E"/><text x="850.0" y="193" font-size="17" fill="#0D2A52">50</text><text x="70" y="253" font-size="17" fill="#0D2A52">MLP-100 unresolved S29/S32</text><rect x="70" y="265" width="15.2" height="42" rx="3" fill="#F2CC60"/><text x="105.2" y="293" font-size="17" fill="#0D2A52">1</text><text x="70" y="353" font-size="17" fill="#0D2A52">External E1/E2 winner</text><rect x="70" y="365" width="4" height="42" rx="3" fill="#8C959F"/><text x="94" y="393" font-size="17" fill="#0D2A52">0</text></g></svg>
