<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Providers and the FlipGuard gate</title><desc id="desc">Candidate generation and decision-stability admission are separate roles</desc>
<rect width="1200" height="420" fill="#ffffff"/><rect x="0" y="0" width="18" height="420" fill="#1F6FEB"/>
<text x="70" y="62" font-family="sans-serif" font-size="32" font-weight="700" fill="#0D2A52">Providers and the FlipGuard gate</text>
<text x="70" y="102" font-family="sans-serif" font-size="18" fill="#475569">Candidate generation and decision-stability admission are separate roles</text>
<g font-family="sans-serif"><text x="70" y="150" font-size="22" fill="#0D2A52">Manual / bounded catalog / external compiler / direct synthesis</text><text x="70" y="192" font-size="22" fill="#334155">Security admission</text><text x="70" y="234" font-size="22" fill="#0D2A52">Decision-stability validation</text><text x="70" y="276" font-size="22" fill="#334155">SAFE | REJECTED | FAILED | PLAN_UNSUPPORTED | NO_SAFE</text><text x="70" y="318" font-size="22" fill="#0D2A52">No-retuning locked audit</text></g></svg>
