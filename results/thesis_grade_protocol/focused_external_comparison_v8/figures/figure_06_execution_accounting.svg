<text x="54.0" y="91.0" font-family="sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#526072">Counts use distinct units and do not treat repeated execution rows as independent inputs.</text>
<rect x="55" y="130" width="1090" height="440" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="85.0" y="173.0" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#172033">Provider</text>
<text x="390.0" y="173.0" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#172033">Unique inputs</text>
