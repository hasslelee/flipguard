<text x="590.0" y="313.0" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#172033">12</text>
<text x="800.0" y="313.0" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#172033">1</text>
<text x="955.0" y="313.0" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#172033">6,000</text>
