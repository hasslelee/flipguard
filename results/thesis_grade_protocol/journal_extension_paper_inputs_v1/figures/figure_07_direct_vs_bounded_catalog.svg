<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc" >
<title id="title">Direct trials and Security-V2 bounded catalog</title>
<desc id="desc">Candidate-space screening is separated from encrypted executable-candidate accounting.</desc>
<rect width="1200" height="700" fill="#ffffff"/>
<text x="55" y="58" font-family="sans-serif" font-size="30" font-weight="700" fill="#111827">Direct trials and Security-V2 bounded catalog</text>
<rect x="120.0" y="130.0" width="430.0" height="390.0" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/>
<text x="335.0" y="164.0" font-family="sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#111827">mlp-100</text>
<text x="335.0" y="194.0" font-family="sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#374151">direct encrypted trials: 1</text>
<text x="335.0" y="219.0" font-family="sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#374151">bounded admitted profiles: 7</text>
<text x="335.0" y="244.0" font-family="sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#374151">catalog executable: 6</text>
<text x="335.0" y="269.0" font-family="sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#374151">catalog static unsupported: 1</text>
<text x="335.0" y="294.0" font-family="sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#374151">screening and execution are separate units</text>
<rect x="670.0" y="130.0" width="430.0" height="390.0" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/>
<text x="885.0" y="164.0" font-family="sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#111827">lenet5-small</text>
<text x="885.0" y="194.0" font-family="sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#374151">direct encrypted trials: 1</text>
<text x="885.0" y="219.0" font-family="sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#374151">bounded admitted profiles: 7</text>
<text x="885.0" y="244.0" font-family="sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#374151">catalog executable: 0</text>
<text x="885.0" y="269.0" font-family="sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#374151">catalog static unsupported: 7</text>
<text x="885.0" y="294.0" font-family="sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#374151">screening and execution are separate units</text>
<text x="600.0" y="610.0" font-family="sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#991b1b">No global-oracle or paired-latency claim is made for this extension.</text>
</svg>
