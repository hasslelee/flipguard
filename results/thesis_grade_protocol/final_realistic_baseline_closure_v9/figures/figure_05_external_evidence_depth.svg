<svg xmlns="http://www.w3.org/2000/svg" width="960" height="504" viewBox="0 0 960 504" role="img" aria-labelledby="title desc">
<title id="title">External-provider evidence depth</title><desc id="desc">Measured, numerical-only, feasibility-only, and paper-only tiers are not conflated.</desc>
<rect width="960" height="504" fill="#ffffff"/><text x="48" y="48" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0d2a52">External-provider evidence depth</text><text x="48" y="78" font-family="Arial,sans-serif" font-size="15" fill="#57606a">Measured, numerical-only, feasibility-only, and paper-only tiers are not conflated.</text>
<g font-family="Arial,sans-serif"><rect x="48" y="118" width="864" height="62" rx="6" fill="#f6f8fa" stroke="#2da44e" stroke-width="2"/><text x="72" y="145" font-size="17" font-weight="700" fill="#0d1117">Decision-bearing measured</text><text x="72" y="167" font-size="14" fill="#57606a">EVA and HEIR</text><rect x="48" y="204" width="864" height="62" rx="6" fill="#f6f8fa" stroke="#1f6feb" stroke-width="2"/><text x="72" y="231" font-size="17" font-weight="700" fill="#0d1117">Numerical plan grid</text><text x="72" y="253" font-size="14" fill="#57606a">CoreLab EVA and ELASM</text><rect x="48" y="290" width="864" height="62" rx="6" fill="#f6f8fa" stroke="#bf8700" stroke-width="2"/><text x="72" y="317" font-size="17" font-weight="700" fill="#0d1117">Auxiliary self-test</text><text x="72" y="339" font-size="14" fill="#57606a">Orion: 10 encrypted inputs, untrained official weights</text><rect x="48" y="376" width="864" height="62" rx="6" fill="#f6f8fa" stroke="#57606a" stroke-width="2"/><text x="72" y="403" font-size="17" font-weight="700" fill="#0d1117">Paper only</text><text x="72" y="425" font-size="14" fill="#57606a">HECATE and objective-incompatible systems</text></g></svg>
