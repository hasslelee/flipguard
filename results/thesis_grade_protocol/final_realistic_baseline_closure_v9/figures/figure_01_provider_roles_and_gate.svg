<svg xmlns="http://www.w3.org/2000/svg" width="960" height="418" viewBox="0 0 960 418" role="img" aria-labelledby="title desc">
<title id="title">Provider roles and the FlipGuard gate</title><desc id="desc">Provider generation and decision-integrity admission are separate roles.</desc>
<rect width="960" height="418" fill="#ffffff"/><text x="48" y="48" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0d2a52">Provider roles and the FlipGuard gate</text><text x="48" y="78" font-family="Arial,sans-serif" font-size="15" fill="#57606a">Provider generation and decision-integrity admission are separate roles.</text>
<g font-family="Arial,sans-serif"><rect x="48" y="118" width="864" height="62" rx="6" fill="#f6f8fa" stroke="#1f6feb" stroke-width="2"/><text x="72" y="145" font-size="17" font-weight="700" fill="#0d1117">Candidate providers</text><text x="72" y="167" font-size="14" fill="#57606a">Default, catalog, EVA, HEIR, and FlipGuard direct</text><rect x="48" y="204" width="864" height="62" rx="6" fill="#f6f8fa" stroke="#2f9eca" stroke-width="2"/><text x="72" y="231" font-size="17" font-weight="700" fill="#0d1117">FlipGuard gate</text><text x="72" y="253" font-size="14" fill="#57606a">Security admission, encrypted validation, bounded repair, and abstention</text><rect x="48" y="290" width="864" height="62" rx="6" fill="#f6f8fa" stroke="#2da44e" stroke-width="2"/><text x="72" y="317" font-size="17" font-weight="700" fill="#0d1117">Locked audit</text><text x="72" y="339" font-size="14" fill="#57606a">Replay the selected literal without retuning</text></g></svg>
