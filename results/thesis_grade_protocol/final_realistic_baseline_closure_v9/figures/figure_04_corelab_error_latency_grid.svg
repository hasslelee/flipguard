<svg xmlns="http://www.w3.org/2000/svg" width="960" height="418" viewBox="0 0 960 418" role="img" aria-labelledby="title desc">
<title id="title">CoreLab numerical plan grid</title><desc id="desc">EVA and ELASM use the official LinearRegression workload; no threshold claim is attached.</desc>
