<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Focused MLP-100 paired total-latency ratios</title>
  <desc id="desc">Graph-only over gap-aware is near one and its confidence interval crosses one. Catalog over gap-aware is near 1.982 and its confidence interval is above one.</desc>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="60" y="58" font-family="sans-serif" font-size="30" font-weight="700" fill="#111827">Focused MLP-100 paired total-latency ratios</text>
  <text x="60" y="92" font-family="sans-serif" font-size="17" fill="#4b5563">Geometric mean over 100 image clusters; class-stratified bootstrap, 10,000 repetitions</text>
  <line x1="180" y1="560" x2="1110" y2="560" stroke="#111827" stroke-width="2"/>
  <line x1="180" y1="140" x2="180" y2="560" stroke="#111827" stroke-width="2"/>
  <line x1="610" y1="140" x2="610" y2="560" stroke="#991b1b" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="610" y="590" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#991b1b">ratio = 1 (no difference)</text>
  <text x="1000" y="590" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#374151">2.0</text>
  <text x="180" y="590" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#374151">0.0</text>
  <text x="60" y="245" font-family="sans-serif" font-size="20" font-weight="700" fill="#111827">Graph-only S32 / gap-aware S29</text>
  <line x1="609.42" y1="275" x2="610.40" y2="275" stroke="#2563eb" stroke-width="8"/>
  <circle cx="609.91" cy="275" r="13" fill="#2563eb"/>
  <text x="650" y="282" font-family="sans-serif" font-size="18" fill="#1f2937">0.999780 [0.998648, 1.000920]</text>
  <text x="60" y="405" font-family="sans-serif" font-size="20" font-weight="700" fill="#111827">Catalog S40 / gap-aware S29</text>
  <line x1="1031.30" y1="435" x2="1033.05" y2="435" stroke="#16a34a" stroke-width="8"/>
  <circle cx="1032.17" cy="435" r="13" fill="#16a34a"/>
  <text x="670" y="478" font-family="sans-serif" font-size="18" fill="#1f2937">1.981795 [1.979758, 1.983842]</text>
  <rect x="60" y="620" width="20" height="20" fill="#2563eb"/>
  <text x="92" y="637" font-family="sans-serif" font-size="16" fill="#374151">Literal effect only; no S29-over-S32 latency superiority</text>
  <rect x="650" y="620" width="20" height="20" fill="#16a34a"/>
  <text x="682" y="637" font-family="sans-serif" font-size="16" fill="#374151">Scoped catalog/S29 paired effect</text>
</svg>
